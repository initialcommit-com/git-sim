5.13" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">the repository: a hidden folder git init created inside my-project/</text><text x="527.88" y="382.12" font-size="21.12" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="48.01" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">HEAD</text><line x1="591.11" y1="374.69" x2="633.91" y2="374.69" fill="none" stroke="#57606A" stroke-width="2.85" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><polygon points="648.17,374.69 633.91,367.56 633.91,381.83" fill="#57606A" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><rect x="663.38" y="359.48" width="73.65" height="30.43" rx="9.13" fill="#1A7F37" fill-opacity="0.4" filter="url(#shadow1)" data-role="note" data-phase="after" data-step="2" class="gs" style="animation-name:gs-in-2;" /><text x="676.7" y="382.61" font-size="21.12" fill="#FFFFFF" xml:space="preserve" font-weight="700" textLength="47.02" lengthAdjust="spacingAndGlyphs" data-role="note" data-phase="after" data-step="2" class="gs" style="animation-name:gs-in-2;">main</text><text x="762.2" y="365.44" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="611.79" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">A pointer (ref) to the currently checked-out branch (or</text><text x="762.2" y="397.01" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="83.9" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">commit).</text><text x="527.88" y="449.71" font-size="21.12" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="71.77" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">config</text><text x="762.2" y="434.65" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="632.87" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">This repo's own settings, including your name, email, its</text><text x="762.2" y="463.65" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="195.86" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">remotes, and more.</text><text x="527.88" y="532.93" font-size="21.12" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="97.51" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">objects/</text><text x="762.2" y="504.25" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="641.04" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">Git's object database: all of Git's objects (blobs, trees,</text><text x="762.2" y="534.64" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="666.58" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">commits) representing your code changes live here. Empty for</text><text x="762.2" y="564.57" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="39.05" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">now.</text><text x="527.88" y="617.45" font-size="21.12" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="60.72" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">refs/</text><text x="762.2" y="600.43" font-size="1