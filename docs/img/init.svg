-in-2;">remote-tracking branches, added on your first fetch</text><text x="527.88" y="780.89" font-size="21.12" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="159.05" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">hooks/, info/</text><text x="762.2" y="765.18" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="599.17" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">Scripts Git can automatically run on events, and local</text><text x="762.2" y="794.18" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="139.29" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">ignore rules.</text><line x1="489.85" y1="320" x2="489.85" y2="774.78" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="489.85" y1="374.69" x2="518.75" y2="374.69" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="489.85" y1="444.1" x2="518.75" y2="444.1" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="489.85" y1="526.99" x2="518.75" y2="526.99" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="489.85" y1="610.03" x2="518.75" y2="610.03" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="489.85" y1="774.78" x2="518.75" y2="774.78" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="550.71" y1="625.52" x2="550.71" y2="724.59" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="550.71" y1="660.07" x2="579.62" y2="660.07" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="550.71" y1="692.26" x2="579.62" y2="692.26" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><line x1="550.71" y1="724.59" x2="579.62" y2="724.59" fill="none" stroke="#656D76" stroke-width="1.52" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;" /><text x="649.13" y="924.94" font-size="19.01" fill="#656D76" xml:space="preserve" textLength="621.74" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">Initialized empty Git repository in .../my-project/.git/</text><text x="436.81" y="967.05" font-size="21.12" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="1046.38" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="2" class="gs" style="animation-name:gs-in-2;">Nothing is tracked yet: git add stages files, then git commit makes the first commit.</text><text x="872.84" y="42.96" font-size="38.01" fill="#1F2328" xml:space="preserve" textLength="174.33" lengthAdjust="spacingAndGlyphs" data-role="title">git init</text><line x1="872.84" y1="63.28" x2="1047.16" y2="63.28" fill="none" stroke="#CF222E" stroke-width="2.28" data-role="title" /></svg>