e:gs-in-1;" /><text x="427.08" y="463.09" font-size="23.96" fill="#0D1117" xml:space="preserve" font-weight="700" textLength="54.47" lengthAdjust="spacingAndGlyphs" data-role="note" data-phase="after" class="gs" style="animation-name:gs-in-1;">HEAD</text><line x1="500.96" y1="454.66" x2="552.74" y2="454.66" fill="none" stroke="#AEB7C2" stroke-width="3.45" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;" /><polygon points="570,454.66 552.74,446.03 552.74,463.29" fill="#AEB7C2" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;" /><rect x="574.32" y="437.4" width="83.55" height="34.52" rx="10.36" fill="#3FB950" fill-opacity="0.4" data-role="note" data-phase="after" class="gs" style="animation-name:gs-in-1;" /><text x="589.42" y="463.65" font-size="23.96" fill="#0D1117" xml:space="preserve" font-weight="700" textLength="53.34" lengthAdjust="spacingAndGlyphs" data-role="note" data-phase="after" class="gs" style="animation-name:gs-in-1;">main</text><text x="709.72" y="460.22" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="566.68" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">where you are: this branch has no commits yet</text><text x="411.97" y="525.43" font-size="23.96" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="81.42" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">config</text><text x="709.72" y="510.53" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="743.22" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">this repository's own settings: your name, its remotes, and</text><text x="709.72" y="543.43" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="48.35" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">more</text><text x="411.97" y="601.74" font-size="23.96" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="110.62" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">objects/</text><text x="709.72" y="584.11" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="755.85" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">the object database: every file, folder and commit is stored</text><text x="709.72" y="617.01" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="237.86" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">here. Empty for now</text><text x="411.97" y="682.66" font-size="23.96" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="68.88" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">refs/</text><text x="709.72" y="663.41" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="742.54" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">heads/ holds the branches and tags/ the tags, one tiny file</text><text x="709.72" y="697.2" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="110.84" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">per label</text><text x="411.97" y="745.51" font-size="23.96" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="180.43" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">hooks/, info/</text><text x="709.72" y="744.14" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="666.74" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">scripts Git can run on events, and local ignore rules</text><text x="638.93" y="865.56" font-size="21.56" fill="#8B949E" xml:space="preserve" textLength="642.14" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">Initialized empty Git repository in .../fresh/.git/</text><text x="366.48" y="913.32" font-size="23.96" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="1187.03" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">Nothing is tracked yet: git add stages files, then git commit makes the first commit.</text><text x="861.12" y="87.28" font-size="43.12" fill="#E6EDF3" xml:space="preserve" textLength="197.76" lengthAdjust="spacingAndGlyphs" data-role="title">git init</text><line x1="861.12" y1="110.33" x2="1058.88" y2="110.33" fill="none" stroke="#F47067" stroke-width="2.59" data-role="title" /></svg>