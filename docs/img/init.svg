<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="301.99 26.94 1316.03 920" width="1316.03" height="920" font-family="&quot;Cascadia Mono&quot;,&quot;JetBrains Mono&quot;,&quot;Fira Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,&quot;Liberation Mono&quot;,monospace" data-scale="86.303375" data-center="0.000000 -0.538796" data-frame="1920 1080"><style>/* gs-loop: the command plays by itself, before -&gt; after, on a loop */
