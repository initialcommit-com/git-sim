phs">[branch "feature/pagination"]  ·  2 settings</text><rect x="1134.09" y="248.29" width="655.38" height="780.51" rx="30.72" fill="#000000" fill-opacity="0.06" stroke="#8250DF" stroke-width="3.07" /><text x="1180.17" y="317.61" font-size="22.74" fill="#656D76" xml:space="preserve" textLength="90.26" lengthAdjust="spacingAndGlyphs">setting</text><text x="1301.14" y="320.57" font-size="31.27" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="161.24" lengthAdjust="spacingAndGlyphs">user.name</text><rect x="1164.81" y="360.93" width="593.94" height="234.24" rx="18.43" fill="#0969DA" fill-opacity="0.07" stroke="#0969DA" stroke-width="2.05" /><text x="1195.53" y="405.45" font-size="22.74" fill="#656D76" xml:space="preserve" textLength="90.26" lengthAdjust="spacingAndGlyphs">section</text><text x="1348.28" y="405.89" font-size="25.58" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="81.35" lengthAdjust="spacingAndGlyphs">[user]</text><text x="1195.53" y="442.03" font-size="22.74" fill="#656D76" xml:space="preserve" textLength="50.28" lengthAdjust="spacingAndGlyphs">name</text><text x="1348.28" y="442.76" font-size="25.58" fill="#8250DF" xml:space="preserve" font-weight="700" textLength="56.97" lengthAdjust="spacingAndGlyphs">name</text><text x="1195.53" y="485.01" font-size="22.74" fill="#656D76" xml:space="preserve" textLength="64.67" lengthAdjust="spacingAndGlyphs">value</text><text x="1348.28" y="484.03" font-size="25.58" fill="#1F9BA6" xml:space="preserve" font-weight="700" textLength="268.44" lengthAdjust="spacingAndGlyphs">Grace Hopper (from</text><text x="1348.28" y="524.93" font-size="25.58" fill="#1F9BA6" xml:space="preserve" font-weight="700" textLength="101.14" lengthAdjust="spacingAndGlyphs">global)</text><text x="1180.17" y="645.04" font-size="24.16" fill="#1F2328" xml:space="preserve" textLength="535.55" lengthAdjust="spacingAndGlyphs">The name Git records as the author and</text><text x="1180.17" y="679.26" font-size="24.16" fill="#1F2328" xml:space="preserve" textLength="418.13" lengthAdjust="spacingAndGlyphs">committer of your new commits.</text><text x="1180.17" y="716.13" font-size="24.16" fill="#1F2328" xml:space="preserve" textLength="492.7" lengthAdjust="spacingAndGlyphs">Existing commits keep the name they</text><text x="1180.17" y="755.64" font-size="24.16" fill="#1F2328" xml:space="preserve" textLength="206.52" lengthAdjust="spacingAndGlyphs">were made with.</text><line x1="1180.17" y1="806.2" x2="1743.39" y2="806.2" fill="none" stroke="#D0D7DE" stroke-width="2.05" /><text x="1180.17" y="860.16" font-size="22.74" fill="#656D76" xml:space="preserve" textLength="63.96" lengthAdjust="spacingAndGlyphs">scope</text><rect x="1274.85" y="831.8" width="116.68" height="40.96" rx="12.29" fill="#8250DF" filter="url(#shadow1)" data-role="ref" /><text x="1292.77" y="862.49" font-size="28.43" fill="#FFFFFF" xml:space="preserve" font-weight="700" textLength="80.84" lengthAdjust="spacingAndGlyphs" data-role="ref">local</text><text x="1180.17" y="908.18" font-size="21.32" fill="#656D76" xml:space="preserve" textLength="498.53" lengthAdjust="spacingAndGlyphs">Written to .git/config, so it applies to</text><text x="1180.17" y="941.76" font-size="21.32" fill="#656D76" xml:space="preserve" textLength="472.88" lengthAdjust="spacingAndGlyphs">this repository only and overrides the</text><text x="1180.17" y="975.67" font-size="21.32" fill="#656D76" xml:space="preserve" textLength="306.81" lengthAdjust="spacingAndGlyphs">global and system values.</text><rect x="156.13" y="603.63" width="890.91" height="98.31" rx="18.43" fill="#0969DA" fill-opacity="0.07" stroke="#0969DA" stroke-width="2.05" data-phase="after" data-role="note" data-step="1" class="gs" style="animation-name:gs-in-1;" /><text x="186.85" y="636.46" font-size="27.01" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="85.87" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="1" class="gs" style="animation-name:gs-in-1;">[user]</text><rect x="171.49" y="656.87" width="860.19" height="43.01" rx="12.29" fill="#1A7F37" fill-opacity="0.18" data-phase="after" data-role="note" data-step="1" class="gs" style="animation-name:gs-in-1;" /><text x="227.82" y="688.08" font-size="27.01" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="297.49" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="1" class="gs" style="animation-name:gs-in-1;"><tspan fill="#8250DF">name</tspan> = <tspan fill="#1F9BA6">Ada Lovelace</tspan></text><text x="1195.53" y="569.17" font-size="22.74" fill="#656D76" xml:space="preserve" textLength="116.91" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="1" class="gs" style="animation-name:gs-in-1;">new value</text><text x="1348.28" y="570.19" font-size="25.58" fill="#1F9BA6" xml:space="preserve" font-weight="700" textLength="178.49" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" data-step="1" class="gs" style="animation-name:gs-in-1;">Ada Lovelace</text><text x="439.92" y="89.58" font-size="51.17" fill="#1F2328" xml:space="preserve" textLength="1040.17" lengthAdjust="spacingAndGlyphs" data-role="title">git config user.name "Ada Lovelace"</text><line x1="439.92" y1="116.93" x2="1480.08" y2="116.93" fill="none" stroke="#CF222E" stroke-width="3.07" data-role="title" /></svg>