<svg xmlns="http://www.w3.org/2000/svg" id="scene" viewBox="59.27 38.6 1801.45 1002.8" width="1801.45" height="1002.8" font-family="&quot;Cascadia Mono&quot;,&quot;JetBrains Mono&quot;,&quot;Fira Mono&quot;,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,&quot;Liberation Mono&quot;,monospace" data-scale="109.090909" data-center="0.600000 0.585100" data-frame="1920 1080"><style>/* gs-loop: the command plays by itself, before -&gt; after, on a loop */
.gs{animation-duration:9.0s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-fill-mode:both}
@media (prefers-reduced-motion:reduce){.gs{animation:none!important}}
@keyframes gs-in-1{0%,20.00%{opacity:0}52.00%,100%{opacity:1}}
@keyframes gs-late-1{0%,47.20%{opacity:0}52.00%,100%{opacity:1}}
@keyframes gs-out-1{0%,20.00%{opacity:1}52.00%,100%{opacity:0}}
@keyframes gs-move-1{0%,20.00%{transform:translate(var(--dx),var(--dy))}52.00%,100%{transform:translate(0,0)}}
@keyframes gs-draw-1{0%,20.00%{stroke-dashoffset:var(--len)}52.00%,100%{stroke-dashoffset:0}}
@keyframes gs-fill-1{0%,20.00%{fill:var(--bf)}52.00%,100%{fill:var(--af)}}</style><defs><filter id="shadow1" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2.18" stdDeviation="3.27" flood-color="#000000" flood-opacity="0.14" /></filter></defs><rect x="59.27" y="38.6" width="1801.45" height="1002.8" fill="#F6F8FA" data-role="background" /><rect x="87.27" y="276.56" width="1003.64" height="736.84" rx="32.73" fill="#000000" fill-opacity="0.04" stroke="#D0D7DE" stroke-width="3.27" /><rect x="125.45" y="200.75" width="271.05" height="71.44" rx="17.45" fill="#000000" fill-opacity="0.12" stroke="#D0D7DE" stroke-width="3.27" /><text x="158.18" y="245.84" font-size="33.31" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="205.6" lengthAdjust="spacingAndGlyphs">.git/config</text><text x="429.23" y="243.5" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="412.45" lengthAdjust="spacingAndGlyphs">this repository's settings</text><text x="147.27" y="349.68" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="328.77" lengthAdjust="spacingAndGlyphs">[core]  ·  6 settings</text><text x="147.27" y="404.22" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="312.8" lengthAdjust="spacingAndGlyphs">[init]  ·  1 setting</text><text x="147.27" y="458.77" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="504.44" lengthAdjust="spacingAndGlyphs">[remote "origin"]  ·  2 settings</text><text x="147.27" y="513.31" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="472.5" lengthAdjust="spacingAndGlyphs">[branch "main"]  ·  2 settings</text><text x="147.27" y="567.86" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="664.13" lengthAdjust="spacingAndGlyphs">[branch "fix/order-totals"]  ·  2 settings</text><text x="147.27" y="622.4" font-size="27.26" fill="#656D76" xml:space="preserve" textLength="696.07" lengthAdjust="spacingAndGlyphs">[branch "feature/pagination"]  ·  2 settings</text><rect x="1156.36" y="276.56" width="676.36" height="736.84" rx="32.73" fill="#000000" fill-opacity="0.06" stroke="#8250DF" stroke-width="3.27" /><text x="1205.45" y="345.14" font-size="33.31" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="171.76" lengthAdjust="spacingAndGlyphs">user.name</text><text x="1205.45" y="407.67" font-size="28.77" fill="#1A7F37" xml:space="preserve" font-weight="700" textLength="367.48" lengthAdjust="spacingAndGlyphs">is set to Ada Lovelace</text><text x="1205.45" y="481.92" font-size="22.71" fill="#656D76" xml:space="preserve" textLength="157.39" lengthAdjust="spacingAndGlyphs">what it does</text><text x="1205.45" y="526.7" font-size="25.74" fill="#1F2328" xml:space="preserve" textLength="541.57" lengthAdjust="spacingAndGlyphs">The name stamped on every commit you</text><text x="1205.45" y="566.18" font-size="25.74" fill="#1F2328" xml:space="preserve" textLength="494.71" lengthAdjust="spacingAndGlyphs">make here, as its author. Commits</text><text x="1205.45" y="605.05" font-size="25.74" fill="#1F2328" xml:space="preserve" textLength="540.36" lengthAdjust="spacingAndGlyphs">already made keep the name they were</text><text x="1205.45" y="647.34" font-size="25.74" fill="#1F2328" xml:space="preserve" textLength="144.19" lengthAdjust="spacingAndGlyphs">made with.</text><text x="1205.45" y="726.39" font-size="22.71" fill="#656D76" xml:space="preserve" textLength="63.88" lengthAdjust="spacingAndGlyphs">scope</text><rect x="1205.45" y="753.56" width="124.3" height="43.64" rx="13.09" fill="#8250DF" filter="url(#shadow1)" data-role="ref" /><text x="1224.55" y="786.26" font-size="30.28" fill="#FFFFFF" xml:space="preserve" font-weight="700" textLength="86.12" lengthAdjust="spacingAndGlyphs" data-role="ref">local</text><text x="1205.45" y="833.96" font-size="24.23" fill="#656D76" xml:space="preserve" textLength="522.77" lengthAdjust="spacingAndGlyphs">written to .git/config, so it applies</text><text x="1205.45" y="872.12" font-size="24.23" fill="#656D76" xml:space="preserve" textLength="508.58" lengthAdjust="spacingAndGlyphs">to this repository only, and it wins</text><text x="1205.45" y="911.41" font-size="24.23" fill="#656D76" xml:space="preserve" textLength="451.04" lengthAdjust="spacingAndGlyphs">over --global (~/.gitconfig) and</text><text x="1205.45" y="948.81" font-size="24.23" fill="#656D76" xml:space="preserve" textLength="121.51" lengthAdjust="spacingAndGlyphs">--system.</text><rect x="120" y="656.19" width="938.18" height="48" rx="13.09" fill="#1A7F37" fill-opacity="0.18" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;" /><text x="147.27" y="690.08" font-size="28.77" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="91.48" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">[user]</text><rect x="120" y="710.74" width="938.18" height="48" rx="13.09" fill="#1A7F37" fill-opacity="0.18" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;" /><text x="190.91" y="745.08" font-size="28.77" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="316.91" lengthAdjust="spacingAndGlyphs" data-phase="after" data-role="note" class="gs" style="animation-name:gs-in-1;">name = Ada Lovelace</text><text x="405.95" y="107.48" font-size="54.51" fill="#1F2328" xml:space="preserve" textLength="1108.1" lengthAdjust="spacingAndGlyphs" data-role="title">git config user.name "Ada Lovelace"</text><line x1="405.95" y1="136.62" x2="1514.05" y2="136.62" fill="none" stroke="#CF222E" stroke-width="3.27" data-role="title" /></svg>