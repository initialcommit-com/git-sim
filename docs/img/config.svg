<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="59.27 38.6 1801.45 1002.8" width="1801.45" height="1002.8" font-family='"Cascadia Mono","JetBrains Mono","Fira Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' data-scale="109.090909" data-center="0.600000 0.585100" data-frame="1920 1080"><rect x="59.27" y="38.6" width="1801.45" height="1002.8" fill="#0D1117" data-role="background"/><rect x="87.27" y="276.56" width="1003.64" height="736.84" rx="32.73" fill="#FFFFFF" fill-opacity="0.06" stroke="#3D444D" stroke-width="3.27"/><rect x="125.45" y="200.75" width="271.05" height="71.44" rx="17.45" fill="#FFFFFF" fill-opacity="0.18" stroke="#3D444D" stroke-width="3.27"/><text x="158.18" y="245.84" font-size="33.31" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="205.6" lengthAdjust="spacingAndGlyphs">.git/config</text><text x="429.23" y="243.5" font-size="27.26" fill="#8B949E" xml:space="preserve" textLength="412.45" lengthAdjust="spacingAndGlyphs">this repository&#x27;s settings</text><text x="147.27" y="349.68" font-size="27.26" fill="#8B949E" xml:space="preserve" textLength="328.77" lengthAdjust="spacingAndGlyphs">[core]  ·  6 settings</text><text x="147.27" y="404.22" font-size="27.26" fill="#8B949E" xml:space="preserve" textLength="312.8" lengthAdjust="spacingAndGlyphs">[init]  ·  1 setting</text><text x="147.27" y="460.99" font-size="28.77" fill="#58A6FF" xml:space="preserve" font-weight="700" textLength="91.48" lengthAdjust="spacingAndGlyphs">[user]</text><text x="190.91" y="513.06" font-size="28.77" fill="#E6EDF3" xml:space="preserve" textLength="401.2" lengthAdjust="spacingAndGlyphs">email = demo@example.com</text><rect x="120" y="536.19" width="938.18" height="48" rx="13.09" fill="#3FB950" fill-opacity="0.16"/><text x="190.91" y="570.08" font-size="28.77" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="182.06" lengthAdjust="spacingAndGlyphs">name = Demo</text><text x="147.27" y="622.4" font-size="27.26" fill="#8B949E" xml:space="preserve" textLength="504.44" lengthAdjust="spacingAndGlyphs">[remote &quot;origin&quot;]  ·  2 settings</text><text x="147.27" y="676.95" font-size="27.26" fill="#8B949E" xml:space="preserve" textLength="472.5" lengthAdjust="spacingAndGlyphs">[branch &quot;main&quot;]  ·  2 settings</text><text x="147.27" y="731.49" font-size="27.26" fill="#8B949E" xml:space="preserve" textLength="520.41" lengthAdjust="spacingAndGlyphs">[branch &quot;branch1&quot;]  ·  2 settings</text><rect x="1156.36" y="276.56" width="676.36" height="736.84" rx="32.73" fill="#FFFFFF" fill-opacity="0.1" stroke="#BC8CFF" stroke-width="3.27"/><text x="1205.45" y="345.14" font-size="33.31" fill="#E6EDF3" xml:space="preserve" font-weight="700" textLength="171.76" lengthAdjust="spacingAndGlyphs">user.name</text><text x="1205.45" y="407.67" font-size="28.77" fill="#3FB950" xml:space="preserve" font-weight="700" textLength="232.63" lengthAdjust="spacingAndGlyphs">is set to Demo</text><text x="1205.45" y="481.92" font-size="22.71" fill="#8B949E" xml:space="preserve" textLength="157.39" lengthAdjust="spacingAndGlyphs">what it does</text><text x="1205.45" y="526.7" font-size="25.74" fill="#E6EDF3" xml:space="preserve" textLength="541.57" lengthAdjust="spacingAndGlyphs">The name stamped on every commit you</text><text x="1205.45" y="566.18" font-size="25.74" fill="#E6EDF3" xml:space="preserve" textLength="494.71" lengthAdjust="spacingAndGlyphs">make here, as its author. Commits</text><text x="1205.45" y="605.05" font-size="25.74" fill="#E6EDF3" xml:space="preserve" textLength="540.36" lengthAdjust="spacingAndGlyphs">already made keep the name they were</text><text x="1205.45" y="647.34" font-size="25.74" fill="#E6EDF3" xml:space="preserve" textLength="144.19" lengthAdjust="spacingAndGlyphs">made with.</text><text x="1205.45" y="726.39" font-size="22.71" fill="#8B949E" xml:space="preserve" textLength="63.88" lengthAdjust="spacingAndGlyphs">scope</text><rect x="1205.45" y="753.56" width="124.3" height="43.64" rx="13.09" fill="#BC8CFF" data-role="ref"/><text x="1224.55" y="786.26" font-size="30.28" fill="#0D1117" xml:space="preserve" font-weight="700" textLength="86.12" lengthAdjust="spacingAndGlyphs" data-role="ref">local</text><text x="1205.45" y="833.96" font-size="24.23" fill="#8B949E" xml:space="preserve" textLength="522.77" lengthAdjust="spacingAndGlyphs">written to .git/config, so it applies</text><text x="1205.45" y="872.12" font-size="24.23" fill="#8B949E" xml:space="preserve" textLength="508.58" lengthAdjust="spacingAndGlyphs">to this repository only, and it wins</text><text x="1205.45" y="911.41" font-size="24.23" fill="#8B949E" xml:space="preserve" textLength="451.04" lengthAdjust="spacingAndGlyphs">over --global (~/.gitconfig) and</text><text x="1205.45" y="948.81" font-size="24.23" fill="#8B949E" xml:space="preserve" textLength="121.51" lengthAdjust="spacingAndGlyphs">--system.</text><text x="563.52" y="107.48" font-size="54.51" fill="#E6EDF3" xml:space="preserve" textLength="792.96" lengthAdjust="spacingAndGlyphs" data-role="title">git config user.name Demo</text><line x1="563.52" y1="136.62" x2="1356.48" y2="136.62" fill="none" stroke="#F47067" stroke-width="3.27" data-role="title"/></svg>