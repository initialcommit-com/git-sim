<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="59.27 35.28 1801.45 880.14" width="1801.45" height="880.14" font-family='"Cascadia Mono","JetBrains Mono","Fira Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' data-scale="105.147864" data-center="0.700000 0.390791" data-frame="1920 1080"><defs><filter id="shadow1" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2.1" stdDeviation="3.15" flood-color="#000000" flood-opacity="0.14"/></filter></defs><rect x="59.27" y="35.28" width="1801.45" height="880.14" fill="#F6F8FA" data-role="background"/><rect x="87.27" y="265.65" width="1009.42" height="621.77" rx="31.54" fill="#000000" fill-opacity="0.04" stroke="#D0D7DE" stroke-width="3.15"/><rect x="124.07" y="192.58" width="261.25" height="68.86" rx="16.82" fill="#000000" fill-opacity="0.12" stroke="#D0D7DE" stroke-width="3.15"/><text x="155.62" y="236.04" font-size="32.11" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="198.17" lengthAdjust="spacingAndGlyphs">.git/config</text><text x="416.87" y="233.78" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="397.54" lengthAdjust="spacingAndGlyphs">this repository&#x27;s settings</text><text x="145.1" y="336.12" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="316.88" lengthAdjust="spacingAndGlyphs">[core]  ·  6 settings</text><text x="145.1" y="388.7" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="301.49" lengthAdjust="spacingAndGlyphs">[init]  ·  1 setting</text><text x="145.1" y="441.27" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="316.88" lengthAdjust="spacingAndGlyphs">[user]  ·  2 settings</text><text x="145.1" y="494.26" font-size="27.73" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="266.9" lengthAdjust="spacingAndGlyphs">[remote &quot;origin&quot;]</text><text x="187.16" y="546.83" font-size="27.73" fill="#1F2328" xml:space="preserve" textLength="695.41" lengthAdjust="spacingAndGlyphs">url = https://github.com/example/sample.git</text><text x="187.16" y="599.4" font-size="27.73" fill="#1F2328" xml:space="preserve" textLength="696.27" lengthAdjust="spacingAndGlyphs">fetch = +refs/heads/*:refs/remotes/origin/*</text><text x="145.1" y="651.57" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="455.42" lengthAdjust="spacingAndGlyphs">[branch &quot;main&quot;]  ·  2 settings</text><text x="145.1" y="704.14" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="501.6" lengthAdjust="spacingAndGlyphs">[branch &quot;branch1&quot;]  ·  2 settings</text><rect x="1159.78" y="265.65" width="672.95" height="621.77" rx="31.54" fill="#000000" fill-opacity="0.06" stroke="#1B7C83" stroke-width="3.15"/><text x="1207.1" y="334.26" font-size="32.11" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="128.93" lengthAdjust="spacingAndGlyphs">remotes</text><rect x="1207.1" y="370.8" width="136" height="42.06" rx="12.62" fill="#1B7C83" filter="url(#shadow1)" data-role="ref"/><text x="1225.5" y="399.58" font-size="29.19" fill="#FFFFFF" xml:space="preserve" font-weight="700" textLength="99.2" lengthAdjust="spacingAndGlyphs" data-role="ref">origin</text><text x="1207.1" y="453.54" font-size="23.35" fill="#1F2328" xml:space="preserve" textLength="503.15" lengthAdjust="spacingAndGlyphs">https://github.com/example/sample.git</text><text x="1207.1" y="518.52" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="430.48" lengthAdjust="spacingAndGlyphs">tracking branches: origin/branch1,</text><text x="1207.1" y="553.51" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="343.43" lengthAdjust="spacingAndGlyphs">origin/branch2, origin/main</text><text x="1207.1" y="633.98" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="203.01" lengthAdjust="spacingAndGlyphs">what a remote is</text><text x="1207.1" y="676.05" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="422.15" lengthAdjust="spacingAndGlyphs">A name for another copy of this</text><text x="1207.1" y="713.37" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="503.88" lengthAdjust="spacingAndGlyphs">repository and its address. fetch and</text><text x="1207.1" y="750.7" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="517.19" lengthAdjust="spacingAndGlyphs">pull bring its commits here as remote-</text><text x="1207.1" y="788.57" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="503.88" lengthAdjust="spacingAndGlyphs">tracking branches (name/branch); push</text><text x="1207.1" y="825.17" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="239.9" lengthAdjust="spacingAndGlyphs">sends yours there.</text><text x="808.74" y="102.69" font-size="52.54" fill="#1F2328" xml:space="preserve" textLength="302.52" lengthAdjust="spacingAndGlyphs" data-role="title">git remote</text><line x1="808.74" y1="130.77" x2="1111.26" y2="130.77" fill="none" stroke="#CF222E" stroke-width="3.15" data-role="title"/></svg>