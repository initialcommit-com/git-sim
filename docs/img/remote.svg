<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="59.27 18.04 1801.45 914.62" width="1801.45" height="914.62" font-family='"Cascadia Mono","JetBrains Mono","Fira Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' data-scale="105.147864" data-center="0.700000 0.226834" data-frame="1920 1080"><defs><filter id="shadow1" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2.1" stdDeviation="3.15" flood-color="#000000" flood-opacity="0.14"/></filter></defs><rect x="59.27" y="18.04" width="1801.45" height="914.62" fill="#F6F8FA" data-role="background"/><rect x="87.27" y="248.41" width="1009.42" height="656.25" rx="31.54" fill="#000000" fill-opacity="0.04" stroke="#D0D7DE" stroke-width="3.15"/><rect x="124.07" y="175.34" width="261.25" height="68.86" rx="16.82" fill="#000000" fill-opacity="0.12" stroke="#D0D7DE" stroke-width="3.15"/><text x="155.62" y="218.8" font-size="32.11" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="198.17" lengthAdjust="spacingAndGlyphs">.git/config</text><text x="416.87" y="216.54" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="397.54" lengthAdjust="spacingAndGlyphs">this repository&#x27;s settings</text><text x="145.1" y="318.88" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="316.88" lengthAdjust="spacingAndGlyphs">[core]  ·  6 settings</text><text x="145.1" y="371.46" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="301.49" lengthAdjust="spacingAndGlyphs">[init]  ·  1 setting</text><text x="145.1" y="424.44" font-size="27.73" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="266.9" lengthAdjust="spacingAndGlyphs">[remote &quot;origin&quot;]</text><text x="187.16" y="477.02" font-size="27.73" fill="#1F2328" xml:space="preserve" textLength="695.41" lengthAdjust="spacingAndGlyphs">url = https://github.com/example/orders.git</text><text x="187.16" y="529.59" font-size="27.73" fill="#1F2328" xml:space="preserve" textLength="696.27" lengthAdjust="spacingAndGlyphs">fetch = +refs/heads/*:refs/remotes/origin/*</text><text x="145.1" y="581.75" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="455.42" lengthAdjust="spacingAndGlyphs">[branch &quot;main&quot;]  ·  2 settings</text><text x="145.1" y="634.33" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="640.13" lengthAdjust="spacingAndGlyphs">[branch &quot;fix/order-totals&quot;]  ·  2 settings</text><text x="145.1" y="686.9" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="670.91" lengthAdjust="spacingAndGlyphs">[branch &quot;feature/pagination&quot;]  ·  2 settings</text><rect x="1159.78" y="248.41" width="672.95" height="656.25" rx="31.54" fill="#000000" fill-opacity="0.06" stroke="#1B7C83" stroke-width="3.15"/><text x="1207.1" y="317.03" font-size="32.11" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="128.93" lengthAdjust="spacingAndGlyphs">remotes</text><rect x="1207.1" y="353.56" width="136" height="42.06" rx="12.62" fill="#1B7C83" filter="url(#shadow1)" data-role="ref"/><text x="1225.5" y="382.34" font-size="29.19" fill="#FFFFFF" xml:space="preserve" font-weight="700" textLength="99.2" lengthAdjust="spacingAndGlyphs" data-role="ref">origin</text><text x="1207.1" y="436.3" font-size="23.35" fill="#1F2328" xml:space="preserve" textLength="503.15" lengthAdjust="spacingAndGlyphs">https://github.com/example/orders.git</text><text x="1207.1" y="500.25" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="225.59" lengthAdjust="spacingAndGlyphs">tracking branches:</text><text x="1207.1" y="535.76" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="562.17" lengthAdjust="spacingAndGlyphs">origin/feature/pagination, origin/fix/order-</text><text x="1207.1" y="570.75" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="241.49" lengthAdjust="spacingAndGlyphs">totals, origin/main</text><text x="1207.1" y="651.22" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="203.01" lengthAdjust="spacingAndGlyphs">what a remote is</text><text x="1207.1" y="693.29" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="422.15" lengthAdjust="spacingAndGlyphs">A name for another copy of this</text><text x="1207.1" y="730.61" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="503.88" lengthAdjust="spacingAndGlyphs">repository and its address. fetch and</text><text x="1207.1" y="767.94" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="517.19" lengthAdjust="spacingAndGlyphs">pull bring its commits here as remote-</text><text x="1207.1" y="805.81" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="503.88" lengthAdjust="spacingAndGlyphs">tracking branches (name/branch); push</text><text x="1207.1" y="842.41" font-size="23.35" fill="#656D76" xml:space="preserve" textLength="239.9" lengthAdjust="spacingAndGlyphs">sends yours there.</text><text x="808.74" y="85.45" font-size="52.54" fill="#1F2328" xml:space="preserve" textLength="302.52" lengthAdjust="spacingAndGlyphs" data-role="title">git remote</text><line x1="808.74" y1="113.53" x2="1111.26" y2="113.53" fill="none" stroke="#CF222E" stroke-width="3.15" data-role="title"/></svg>