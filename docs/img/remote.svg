<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="59.27 -0.03 1801.45 950.77" width="1801.45" height="950.77" font-family='"Cascadia Mono","JetBrains Mono","Fira Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' data-scale="105.147864" data-center="0.700000 0.054919" data-frame="1920 1080" data-theme="light"><defs><filter id="shadow1" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2.1" stdDeviation="3.15" flood-color="#000000" flood-opacity="0.14"/></filter></defs><rect x="59.27" y="-0.03" width="1801.45" height="950.77" fill="#F6F8FA" data-role="background"/><rect x="87.27" y="230.33" width="1009.42" height="692.41" rx="31.54" fill="#000000" fill-opacity="0.04" stroke="#D0D7DE" stroke-width="3.15"/><rect x="124.07" y="157.26" width="261.25" height="68.86" rx="16.82" fill="#000000" fill-opacity="0.12" stroke="#D0D7DE" stroke-width="3.15"/><text x="155.62" y="200.72" font-size="32.11" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="198.17" lengthAdjust="spacingAndGlyphs">.git/config</text><text x="416.87" y="198.47" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="397.54" lengthAdjust="spacingAndGlyphs">this repository&#x27;s settings</text><text x="145.1" y="300.81" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="316.88" lengthAdjust="spacingAndGlyphs">[core]  ·  6 settings</text><text x="145.1" y="353.38" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="301.49" lengthAdjust="spacingAndGlyphs">[init]  ·  1 setting</text><text x="145.1" y="406.37" font-size="27.73" fill="#0969DA" xml:space="preserve" font-weight="700" textLength="266.9" lengthAdjust="spacingAndGlyphs">[remote &quot;origin&quot;]</text><text x="187.16" y="458.94" font-size="27.73" fill="#1F2328" xml:space="preserve" textLength="695.41" lengthAdjust="spacingAndGlyphs">url = https://github.com/example/orders.git</text><text x="187.16" y="511.51" font-size="27.73" fill="#1F2328" xml:space="preserve" textLength="696.27" lengthAdjust="spacingAndGlyphs">fetch = +refs/heads/*:refs/remotes/origin/*</text><text x="145.1" y="563.68" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="455.42" lengthAdjust="spacingAndGlyphs">[branch &quot;main&quot;]  ·  2 settings</text><text x="145.1" y="616.25" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="640.13" lengthAdjust="spacingAndGlyphs">[branch &quot;fix/order-totals&quot;]  ·  2 settings</text><text x="145.1" y="668.83" font-size="26.27" fill="#656D76" xml:space="preserve" textLength="670.91" lengthAdjust="spacingAndGlyphs">[branch &quot;feature/pagination&quot;]  ·  2 settings</text><rect x="1159.78" y="230.33" width="672.95" height="692.41" rx="31.54" fill="#000000" fill-opacity="0.06" stroke="#1B7C83" stroke-width="3.15"/><text x="1207.1" y="304.21" font-size="32.11" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="128.93" lengthAdjust="spacingAndGlyphs">remotes</text><rect x="1207.1" y="340.74" width="136" height="42.06" rx="12.62" fill="#1B7C83" filter="url(#shadow1)" data-role="ref"/><text x="1225.5" y="369.52" font-size="29.19" fill="#FFFFFF" xml:space="preserve" font-weight="700" textLength="99.2" lengthAdjust="spacingAndGlyphs" data-role="ref">origin</text><rect x="1191.33" y="409.08" width="609.86" height="241.26" rx="18.93" fill="#1B7C83" fill-opacity="0.07" stroke="#1B7C83" stroke-width="2.1"/><text x="1222.87" y="454.98" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="35.92" lengthAdjust="spacingAndGlyphs">url</text><text x="1360.07" y="454.09" font-size="24.81" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="390.38" lengthAdjust="spacingAndGlyphs">https://github.com/example/</text><text x="1360.07" y="493.36" font-size="24.81" fill="#1F2328" xml:space="preserve" font-weight="700" textLength="142.86" lengthAdjust="spacingAndGlyphs">orders.git</text><text x="1222.87" y="538.64" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="100.39" lengthAdjust="spacingAndGlyphs">tracking</text><text x="1360.07" y="539.98" font-size="24.81" fill="#656D76" xml:space="preserve" font-weight="700" textLength="371.58" lengthAdjust="spacingAndGlyphs">origin/feature/pagination,</text><text x="1360.07" y="579.63" font-size="24.81" fill="#656D76" xml:space="preserve" font-weight="700" textLength="342.5" lengthAdjust="spacingAndGlyphs">origin/fix/order-totals,</text><text x="1360.07" y="619.29" font-size="24.81" fill="#656D76" xml:space="preserve" font-weight="700" textLength="157.01" lengthAdjust="spacingAndGlyphs">origin/main</text><line x1="1207.1" y1="692.4" x2="1785.41" y2="692.4" fill="none" stroke="#D0D7DE" stroke-width="2.1"/><text x="1207.1" y="733" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="525.06" lengthAdjust="spacingAndGlyphs">A remote is a name for the URL of another</text><text x="1207.1" y="765.6" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="523.69" lengthAdjust="spacingAndGlyphs">repository. git fetch copies its branches</text><text x="1207.1" y="800.6" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="407.22" lengthAdjust="spacingAndGlyphs">here as remote-tracking branches</text><text x="1207.1" y="836.1" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="561.15" lengthAdjust="spacingAndGlyphs">(&lt;remote&gt;/&lt;branch&gt;), and git push sends your</text><text x="1207.1" y="872.97" font-size="21.89" fill="#656D76" xml:space="preserve" textLength="186.08" lengthAdjust="spacingAndGlyphs">branches to it.</text><text x="808.74" y="67.37" font-size="52.54" fill="#1F2328" xml:space="preserve" textLength="302.52" lengthAdjust="spacingAndGlyphs" data-role="title">git remote</text><line x1="808.74" y1="95.46" x2="1111.26" y2="95.46" fill="none" stroke="#CF222E" stroke-width="3.15" data-role="title"/></svg>