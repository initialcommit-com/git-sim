name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    # skia-python publishes no 3.15 wheels yet, so 3.15 runs report
    # whether the install works there without failing the others
    continue-on-error: ${{ matrix.python == '3.15' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the libraries skia needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libfontconfig1
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Set a Git identity for the test repos
        run: |
          git config --global user.name "git-sim tests"
          git config --global user.email "tests@example.com"
          git config --global init.defaultBranch main
      - name: Unit tests
        run: python -m pytest tests/unit_tests -q
      - name: Draw a simulation
        shell: bash
        run: |
          git init -q demo && cd demo
          echo a > a && git add a && git commit -qm First
          echo b > b && git add b && git commit -qm Second
          git-sim -d --media-dir ../media log
          ls -R ../media
