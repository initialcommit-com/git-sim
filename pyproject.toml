[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "git-sim"
authors = [{ name = "Jacob Stopak", email = "jacob@initialcommit.io" }]
description = "Simulate Git commands on your own repos by generating an image (default) or video visualization depicting the command's behavior."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "git",
    "sim",
    "simulation",
    "simulate",
    "git-simulate",
    "git-simulation",
    "git-sim",
    "manim",
    "animation",
    "gitanimation",
    "image",
    "video",
    "dryrun",
    "dry-run",
]
license = { text = "GPL-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
]
# The default ("core") install: pre-flight engine, text graph, static image
# simulation (skia), MCP server and Claude Code hook. No Manim.
dependencies = [
    "git-dummy",
    "gitpython",
    "mcp>=2.0",
    "numpy",
    "pydantic_settings",
    "skia-python",
    "typer",
    "fonttools",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "git_sim.__version__" }

[project.optional-dependencies]
# Animated video output (--animate) via Manim.
extras = ["manim", "opencv-python-headless"]
dev = ["black", "pillow", "pytest"]
# Kept so `pip install git-sim[mcp]` from older docs still works; the MCP
# server is part of the core install now.
mcp = []

[project.scripts]
git-sim = "git_sim.__main__:app"
git-sim-mcp = "git_sim.mcp_server:main"
git-sim-hook = "git_sim.claude_hook:main"

[project.urls]
Homepage = "https://initialcommit.com/tools/git-sim"
Source = "https://github.com/initialcommit-com/git-sim"
